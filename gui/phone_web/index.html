<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#060402">
    <title>MakiAI Mobile Video & Voice</title>
    <link rel="manifest" href="/call/manifest.json">
    <link rel="stylesheet" href="/call/css/phone.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="phone-shell">
        <div class="bg-glow bg-glow-1"></div>
        <div class="bg-glow bg-glow-2"></div>
        <div class="bg-grid"></div>

        <!-- Top Navigation Bar -->
        <header class="phone-header">
            <div class="brand-badge">
                <span class="status-dot" id="connection-dot"></span>
                <span class="brand-name" id="brand-name">MakiAI</span>
            </div>
            <div class="call-badge" id="call-status-badge">
                <span class="pulse-indicator"></span>
                <span id="call-status-text">Standby</span>
            </div>
        </header>

        <!-- Video Mode Switcher Bar -->
        <nav class="video-mode-nav" id="video-mode-bar">
            <button class="mode-btn active" data-mode="orb" title="Reactor Orb">
                <svg viewBox="0 0 24 24" class="mode-svg"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>
                <span>Voice Orb</span>
            </button>
            <button class="mode-btn" data-mode="screen" title="PC Screen Share">
                <svg viewBox="0 0 24 24" class="mode-svg"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
                <span>PC Screen</span>
            </button>
            <button class="mode-btn" data-mode="webcam" title="Laptop Built-in Camera">
                <svg viewBox="0 0 24 24" class="mode-svg"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                <span>Laptop Cam</span>
            </button>
            <button class="mode-btn" data-mode="phone_cam" title="Phone Camera (Gemini Vision)">
                <svg viewBox="0 0 24 24" class="mode-svg"><path d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V6zM20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h4.05l1.83-2h4.24l1.83 2H20v12z"/></svg>
                <span>Phone Cam</span>
            </button>
        </nav>

        <!-- Main Call Stage -->
        <main class="call-stage">
            
            <!-- Video & Orb Display Viewport -->
            <div class="stage-viewport" id="stage-viewport">
                
                <!-- 1. Glowing Reactor Orb Visualizer -->
                <div class="visualizer-wrap" id="visualizer-wrap">
                    <div class="orb-halo" id="orb-halo"></div>
                    <div class="orb-core" id="orb-core">
                        <div class="orb-layer orb-layer-1"></div>
                        <div class="orb-layer orb-layer-2"></div>
                        <div class="orb-layer orb-layer-3"></div>
                    </div>
                    <div class="audio-waves" id="audio-waves">
                        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
                        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
                        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
                    </div>
                </div>

                <!-- 2. Remote Video Stream (PC Screen / Laptop Webcam) -->
                <div class="remote-video-wrap" id="remote-video-wrap" hidden>
                    <img id="remote-stream-img" class="stream-surface" alt="Remote Stream Feed" />
                    <div class="video-overlay-badge" id="video-overlay-badge">PC Screen Share</div>
                </div>

                <!-- 3. Local Phone Camera Feed (Phone ➔ Gemini Vision) -->
                <div class="local-cam-wrap" id="local-cam-wrap" hidden>
                    <video id="local-cam-feed" class="stream-surface" playsinline autoplay muted></video>
                    <button class="btn-flip-cam" id="btn-flip-cam" title="Flip Camera">
                        <svg viewBox="0 0 24 24" style="width: 1.3rem; height: 1.3rem; fill: currentColor;"><path d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 11.5V13H9v2.5L5.5 12 9 8.5V11h6V8.5l3.5 3.5-3.5 3.5z"/></svg>
                    </button>
                    <div class="video-overlay-badge">Maki Vision Mode</div>
                </div>
            </div>

            <!-- Hidden canvas for capturing phone video snapshots for Gemini Vision -->
            <canvas id="vision-snapshot-canvas" hidden></canvas>

            <!-- Call Info & Timer -->
            <div class="call-info">
                <h1 class="call-title" id="call-target-title">Maki Assistant</h1>
                <div class="call-timer" id="call-timer">00:00</div>
                <div class="call-subtext" id="call-subtext">Tap Call to speak with your PC</div>
            </div>

            <!-- Live Transcript Bubble Feed -->
            <div class="transcript-container" id="transcript-container">
                <div class="transcript-msg system-msg">
                    <div class="msg-bubble">Live VoIP stream ready. Tap Call below to talk.</div>
                </div>
            </div>
        </main>

        <!-- Quick Command Chips -->
        <div class="quick-chips" id="quick-chips">
            <button class="chip" data-cmd="What is the weather today?">🌤️ Weather</button>
            <button class="chip" data-cmd="What is on my schedule today?">📅 Schedule</button>
            <button class="chip" data-cmd="Maki, share your screen">💻 Share Screen</button>
            <button class="chip" data-cmd="Maki, show your camera">👁️ Laptop Cam</button>
            <button class="chip" data-cmd="What am I holding right now?">🔍 What is this?</button>
        </div>

        <!-- Bottom Call Control Dock -->
        <footer class="call-dock">
            <button class="dock-btn btn-secondary" id="btn-mute" title="Mute Microphone" disabled>
                <svg viewBox="0 0 24 24" class="btn-svg" id="mic-icon">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3Zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-2.08c3.39-.49 6-3.39 6-6.92h-2Z"/>
                </svg>
                <span class="btn-label">Mute</span>
            </button>

            <!-- Big Call Action Button -->
            <button class="dock-btn btn-call" id="btn-call-action" title="Start Live Call">
                <svg viewBox="0 0 24 24" class="call-svg" id="call-icon">
                    <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2Z"/>
                </svg>
            </button>

            <button class="dock-btn btn-secondary" id="btn-speaker" title="Speaker Boost">
                <svg viewBox="0 0 24 24" class="btn-svg">
                    <path d="M3 9v6h4l5 5V4L7 9H3Zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02ZM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77Z"/>
                </svg>
                <span class="btn-label">Speaker</span>
            </button>
        </footer>

        <!-- Optional Passcode Modal -->
        <div class="pin-modal-overlay" id="pin-modal" hidden>
            <div class="pin-modal-card">
                <h3>Enter Access PIN</h3>
                <p>Authentication required to connect with MakiAI.</p>
                <input type="password" id="pin-input" placeholder="••••" maxlength="8" autocomplete="off">
                <div class="pin-actions">
                    <button class="btn-cancel" id="btn-pin-cancel">Cancel</button>
                    <button class="btn-submit" id="btn-pin-submit">Connect</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/call/js/phone.js"></script>
</body>
</html>
